<!-- book-card.html -->
<a [routerLink]="['/books', book().id]"
   class="group block bg-card rounded-lg overflow-hidden hover:shadow-lg transition-shadow duration-200">
  <div class="aspect-[2/3] overflow-hidden bg-border">
    <img [src]="book().coverUrl"
         [alt]="book().title"
         loading="lazy"
         class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
  </div>
  <div class="p-3">
    <h3 class="font-medium text-sm text-text truncate">{{ book().title }}</h3>
    <p class="text-xs text-text-secondary truncate">{{ book().author }}</p>
    <app-rating [value]="book().rating" class="mt-1" />
  </div>
</a>
