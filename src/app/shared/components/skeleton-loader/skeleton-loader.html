@switch (variant()) {
  @case ('card') {
    <div class="animate-pulse bg-border rounded-lg h-64 w-full"></div>
  }
  @case ('text') {
    <div class="animate-pulse bg-border rounded h-4 w-3/4"></div>
  }
  @case ('circle') {
    <div class="animate-pulse bg-border rounded-full h-10 w-10"></div>
  }
}
